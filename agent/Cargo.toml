[package]
name = "mirai-agent"
version = "0.7.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
starship-battery = "0.11.1"
sysinfo = "0.39.6"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
